{{- /* Schema.org JSON-LD 修复版，无多余逗号，兼容 Hugo 0.164.0 */ -}}
{{- $isoFormat := "2006-01-02T15:04:05-07:00" -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ .Site.BaseURL }}#website",
      "url": "{{ .Site.BaseURL }}",
      "name": "{{ .Site.Title }}",
      {{- with .Site.Params.description }}
      "description": "{{ . }}",
      {{- end }}
      "publisher": {
        "@id": "{{ .Site.BaseURL }}#author"
      }
    },
    {
      "@type": "Person",
      "@id": "{{ .Site.BaseURL }}#author",
      "name": "{{ .Site.Params.author.name }}"
      {{- with .Site.Params.author.avatar }},
      "image": "{{ . | absURL }}"
      {{- end }}
    },
    {
      "@type": "WebPage",
      "@id": "{{ .Permalink }}#webpage",
      "url": "{{ .Permalink }}",
      "name": "{{ .Title }}",
      "isPartOf": {
        "@id": "{{ .Site.BaseURL }}#website"
      }
      {{- if not .Date.IsZero }},
      "datePublished": "{{ .Date.Format $isoFormat }}"
      {{- end }}
      {{- if not .Lastmod.IsZero }},
      "dateModified": "{{ .Lastmod.Format $isoFormat }}"
      {{- end }}
    }
    {{- if not .IsHome }}
    ,{
      "@type": "BreadcrumbList",
      "@id": "{{ .Permalink }}#breadcrumb",
      "itemListElement": [
        {{- $anc := .Ancestors.Reverse }}
        {{- $hasPrev := false }}
        {{- range $idx, $page := $anc }}
        {{- if $hasPrev }},{{ end }}
        {
          "@type": "ListItem",
          "position": {{ add $idx 1 }},
          "name": "{{ $page.Title }}",
          "item": "{{ $page.Permalink }}"
        }
        {{- $hasPrev = true }}
        {{- end }}
        {{- if $hasPrev }},{{ end }}
        {
          "@type": "ListItem",
          "position": {{ add (len $anc) 1 }},
          "name": "{{ .Title }}",
          "item": "{{ .Permalink }}"
        }
      ]
    }
    {{- end }}
    {{- if eq .Kind "page" }}
    ,{
      "@type": "Article",
      "@id": "{{ .Permalink }}#article",
      "mainEntityOfPage": {
        "@id": "{{ .Permalink }}#webpage"
      },
      "headline": "{{ .Title }}",
      "datePublished": "{{ .Date.Format $isoFormat }}",
      "dateModified": "{{ .Lastmod.Format $isoFormat }}",
      "author": {
        "@id": "{{ .Site.BaseURL }}#author"
      },
      "publisher": {
        "@id": "{{ .Site.BaseURL }}#author"
      }
    }
    {{- end }}
  ]
}
</script>
